[project]
name = "esp32-ai"
version = "0.1.0"
description = "Memory-efficient PLE model runtime and firmware for ESP32-S3 microcontrollers, plus a fruit fly connectome port"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "requests>=2.34.2",
    "tokenizers>=0.23.1",
    "torch>=2.11.0",
    "tqdm>=4.69.0",
]

# Torch has to come from the CUDA index, pinned here rather than installed by
# hand. PyPI's Windows torch is the CPU build, and `uv run` re-syncs on every
# invocation: a manually installed CUDA wheel gets silently replaced, after
# which torch.cuda reports "not compiled with CUDA enabled" while the install
# log still claims a successful upgrade. `torch-backend` does not fix this -
# it only seeds defaults when creating a project, and did not redirect
# resolution here in testing. An explicit source does.
#
# The floor is 2.11 because the CUDA index tops out below PyPI's current
# torch; demanding 2.13 makes the two unsatisfiable.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

# scripts/benchmark_device.py talks to the board over USB serial. Only needed to
# benchmark hardware: uv sync --extra device
[project.optional-dependencies]
device = ["pyserial>=3.5"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Install only reusable PLE modules; experiment code is not packaged.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["model", "quantize"]
