[project]
name = "esp32-ai"
version = "0.1.0"
description = "Memory-efficient PLE model runtime and firmware for ESP32-S3 microcontrollers, plus a fruit fly connectome port"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1",
    "numpy>=2.5.1",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
    "tqdm>=4.69.0",
    "transformers>=5.20.1",
    "zhconv>=1.4.3",
]

# scripts/benchmark_device.py talks to the board over USB serial. Only needed to
# benchmark hardware: uv sync --extra device
[project.optional-dependencies]
device = ["pyserial>=3.5"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Install only reusable PLE modules; experiment code is not packaged.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["model", "quantize"]

# The default Windows wheel is CPU-only, which trains this model about two
# orders of magnitude too slowly. Pin torch to the CUDA 13.0 index instead.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
